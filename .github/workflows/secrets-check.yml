name: Secrets Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Detect secrets in incoming commits with Talisman
        # Third-party action, pin to commit SHA!
        # See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
        # enforced by digitalservicebund/github-actions/github-actions-linter
        uses: carhartl/talisman-secrets-scan-action@702fc5c52170632a568124896148a80f38521ac4 # v1.4.0
        with:
          # The action defaults local-sha/remote-sha to github.event.after/before, which for
          # pull_request events are the PR branch's previous/new head SHAs. After a force-push
          # (amend/rebase) the previous head becomes an orphaned commit that's no longer
          # resolvable, breaking the action's internal `git diff`. Pin to the PR's actual
          # head/base SHAs instead, which stay resolvable since the base is always an ancestor
          # of the checked-out merge commit.
          local-sha: ${{ github.event.pull_request.head.sha || github.event.after }}
          remote-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Send status to Slack
        uses: digitalservicebund/notify-on-failure-gha@671832f192aee0a068fd92b2f6deb975df794a84 # v1.6.1
        if: ${{ failure() }}
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

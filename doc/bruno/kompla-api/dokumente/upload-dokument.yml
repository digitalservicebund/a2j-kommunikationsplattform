info:
  name: Upload Dokument
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/verfahren/{{VERFAHREN_ID}}/einreichungen/{{EINREICHUNG_ID}}/dokumente"
  headers:
    - name: Dokument-Typ
      value: XJUSTIZ
    - name: Dokument-Sichtbarkeit-Alle
      value: "true"
    - name: Dokument-Anzeigename
      value: sample_klaver_3500001.xml
  body:
    type: multipart-form
    data:
      - name: datei
        value: "@file(../../data/xjustiz/sample_klaver_3500001.xml)"
        contentType: ""
  auth: inherit

settings:
  encodeUrl: true
